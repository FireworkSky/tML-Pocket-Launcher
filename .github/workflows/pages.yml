name: Deploy launcher website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/website/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'release' && 'launcher-release-refresh' || 'launcher-pages' }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch a deployment from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build website with public releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          node scripts/website/build.mjs "$RUNNER_TEMP/launcher-site" "$RUNNER_TEMP/releases.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/launcher-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
