<!doctype html>
<html lang="{{language}}" data-theme="{{theme}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>{{title}}</title>
    <style>
      * { box-sizing: border-box; }
      html { font: 16px/1.5 Roboto, sans-serif; }
      body { background: #131b37; color: #e9edff; margin: 0; padding: 20px; }
      main {
        max-width: 32rem; margin: 8vh auto; padding: 24px;
        border: 2px solid #465889; border-radius: 6px; background: #212b4f;
      }
      h1 { margin: 0; font-size: 1.4rem; line-height: 1.3; }
      p { color: #bec9ee; margin: 12px 0 20px; }
      a {
        display: inline-block; padding: 10px 20px; border: 1px solid #ffe745;
        border-radius: 6px; background: #354881; color: #fff08d; text-decoration: none;
      }
      a:focus { outline: 2px solid currentColor; outline-offset: 3px; }
      [data-theme="light"] body { background: #e4ecf8; color: #1d2a47; }
      [data-theme="light"] main { background: #f6f9ff; border-color: #b7c5df; }
      [data-theme="light"] p { color: #53648a; }
      [data-theme="light"] a { color: #332400; background: #e8c65a; border-color: #b8860b; }
    </style>
  </head>
  <body>
    <main>
      <h1>{{title}}</h1>
      <p>{{detail}}</p>
      <a href="tmlpocket://close">{{close}}</a>
    </main>
  </body>
</html>
